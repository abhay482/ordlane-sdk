[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ordlane"
version = "0.1.0"
description = "Plug-and-play model routing, file conversion, and LangGraph RAG for any AI stack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ordlane" }]
keywords = ["llm", "routing", "rag", "langgraph", "openai", "anthropic", "bedrock"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
bedrock = ["boto3>=1.34"]
s3 = ["boto3>=1.34"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
langchain = [
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "langchain-huggingface>=0.1",
  "langchain-openai>=0.2",
]
pdf = ["pypdf>=5.0"]
html = ["markdownify>=0.13"]
tokens = ["tiktoken>=0.7"]
all = [
  "openai>=1.40",
  "anthropic>=0.40",
  "boto3>=1.34",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "langchain-huggingface>=0.1",
  "langchain-openai>=0.2",
  "pypdf>=5.0",
  "markdownify>=0.13",
  "tiktoken>=0.7",
]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/abhay482/ordlane-sdk"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordlane = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
